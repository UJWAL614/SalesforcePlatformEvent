<template>
    <lightning-card title="Service Request Details"   icon-name="standard:case"> 
        <div class="slds-p-horizontal_small">
            <lightning-record-edit-form
                record-id={recordId}
                object-api-name="Service_Request__c"
                layout-type="Full"
                columns="2"
                onsuccess={handleSuccess}
                onerror={handleError}
                >

                 <lightning-messages></lightning-messages>
               <lightning-input-field
                    field-name="Name">
                </lightning-input-field>

                <lightning-input-field
                    field-name="External_System_ID__c">
                </lightning-input-field>

                <lightning-input-field
                    label="Account"
                    value={accountId}           
                    field-name="Account__c">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Subject__c">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Category__c">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Priority__c">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Status__c">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Closed_Date__c">
                </lightning-input-field>

                <div class="slds-m-top_medium">

                    <lightning-button
                        type="submit"
                        label="Save"
                        variant="brand">
                    </lightning-button>
                </div>
            </lightning-record-edit-form>
            
        </div>
        </lightning-card>   
</template>
