<template>
    <lightning-card
        title="Service Request Subscriber"
        icon-name="standard:service_appointment">

        <div class="slds-p-around_medium">

            <template if:true={serviceRequestTitle}>

                <p>
                    <strong>Service Request Title:</strong>
                </p>

                <p>{serviceRequestTitle}</p>
                <div class="slds-m-top_medium">
                    <strong>Service Request Id:</strong>
                    <p>{serviceRequestId}</p>
                </div>

                <div class="slds-m-top_medium">
                    <strong>Service Request Description:</strong>
                </div>

                <p>{serviceRequestDescription}</p>

            </template>

            <template if:false={serviceRequestTitle}>
                <p>No Service Request received yet.</p>
            </template>

        </div>
    </lightning-card>
</template>
