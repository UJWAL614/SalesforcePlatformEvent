            <lightning-record-view-form
                record-id={recordId}
                object-api-name="Service_Request__c"
                layout-type="Full"
                mode="view">
            </lightning-record-view-form>
             <lightning-output-field
                    field-name="Name">

                <lightning-output-field
                    field-name="External_System_ID__c">
                </lightning-output-field>

                <lightning-output-field

                <lightning-output-field
                    field-name="Subject__c">

                <lightning-output-field
